name: build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'prefs/**'
      - 'control'
      - 'tools/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 环境
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 构建
        run: |
          set -o pipefail
          chmod +x tools/build-macos.sh
          bash tools/build-macos.sh 2>&1 | tee build.log

      - name: 上传 deb
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daynightswitch-deb
          path: |
            dist/*.deb
            build.log
          if-no-files-found: warn
